name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - name: Archive app
      uses: actions/upload-artifact@v7
      with:
        name: fussifinder-frontend
        path: build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Download app
        uses: actions/download-artifact@v8
        with:
          name: fussifinder-frontend
          path: build
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: 'Transfer app (develop)'
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: rsync -avz --delete build/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/fussifinder-dev/frontend/
      - name: 'Transfer app (main)'
        if: ${{ github.ref == 'refs/heads/main' }}
        run: rsync -avz --delete build/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/fussifinder/frontend/
